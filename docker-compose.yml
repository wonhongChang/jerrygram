services:
  recommend:
    build:
      context: ./jerrygram-recommend
    container_name: jg-recommend
    ports:
      - "${JG_RECOMMEND_PORT:-13001}:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:test@postgres:5432/jerrygram
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ENABLE_CACHE=true
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:13000,http://localhost:3000,https://localhost:44342}
    depends_on:
      - postgres
      - elasticsearch
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:17
    container_name: jg-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: jerrygram
    ports:
      - "${JG_POSTGRES_PORT:-15433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: jg-redis
    ports:
      - "${JG_REDIS_PORT:-16380}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    sysctls:
      - net.core.somaxconn=65535

volumes:
  pgdata:
  redis_data:
